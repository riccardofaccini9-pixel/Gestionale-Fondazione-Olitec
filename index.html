<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Olitec | Gestione</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--green:#176044;--dark:#173d2e;--soft:#e4f2ea;--ink:#192721;--muted:#627169;--line:#dce4de;--paper:#f7f7f2}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--paper);color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.login-card,.card{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 30px #173d2e14}.login-card{width:min(420px,100%);padding:30px}.login h1{margin:0;font-family:Georgia,serif;font-size:2rem}.login p{color:var(--muted)}label{display:grid;gap:6px;font-size:.85rem;font-weight:700;margin:16px 0}input,select,textarea{width:100%;padding:10px 11px;border:1px solid #cbd8cf;border-radius:8px;background:#fff}.primary{border:0;border-radius:8px;padding:11px 15px;background:var(--green);color:#fff;font-weight:700}.secondary{border:1px solid var(--line);border-radius:8px;padding:10px 13px;background:#fff;color:#385247;font-weight:700}.danger{background:#fff0ef;color:#a43c37;border:0;border-radius:8px;padding:9px 11px}.app{min-height:100vh;display:grid;grid-template-columns:235px 1fr}aside{background:var(--dark);color:#fff;padding:26px 16px;display:flex;flex-direction:column;gap:25px}.brand{padding:0 10px}.brand small{display:block;letter-spacing:.12em;color:#b6d3c4;text-transform:uppercase;font-size:.65rem}.brand strong{font:1.7rem Georgia,serif}nav{display:grid;gap:5px}nav button{border:0;background:transparent;color:#c5dacf;text-align:left;padding:11px;border-radius:8px}nav button.active,nav button:hover{background:#29634b;color:#fff}.logout{margin-top:auto}main{padding:32px clamp(18px,4vw,58px);max-width:1450px;width:100%}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:15px;margin-bottom:24px}h1{margin:0;font-size:2rem}.subtitle{margin:5px 0;color:var(--muted)}.card{padding:20px;margin-bottom:20px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}.toolbar input{flex:1;min-width:180px}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:680px}th,td{text-align:left;padding:13px;border-bottom:1px solid #edf0ed}th{font-size:.72rem;text-transform:uppercase;color:var(--muted);letter-spacing:.05em}.chips{display:flex;gap:5px;flex-wrap:wrap}.chip{background:var(--soft);color:#18563d;border-radius:20px;padding:3px 8px;font-size:.75rem}.empty{color:var(--muted);padding:20px 0}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.span-2{grid-column:span 2}.check-list{border:1px solid #cbd8cf;border-radius:8px;padding:10px;display:flex;gap:12px;flex-wrap:wrap;min-height:44px}.check{display:flex;align-items:center;gap:6px;font-weight:500;font-size:.9rem}.check input{width:auto}.actions{display:flex;gap:8px;flex-wrap:wrap}.notice{padding:10px 12px;border-radius:8px;background:#fff6d9;color:#725500;margin:0 0 16px}.ok{background:var(--soft);color:#18563d}.two{display:grid;grid-template-columns:1fr 1fr;gap:20px}.list{display:grid;gap:8px}.item{border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;justify-content:space-between;gap:10px;align-items:center}.select-box{max-height:250px;overflow:auto}.footer{color:var(--muted);font-size:.8rem;margin-top:10px}@media(max-width:760px){.app{display:block}aside{padding:13px 16px;position:sticky;top:0;z-index:3;flex-direction:row;align-items:center}.brand small{display:none}.brand strong{font-size:1.2rem}nav{display:flex;overflow:auto;flex:1}nav button{white-space:nowrap}.logout{margin:0}main{padding:24px 16px}.top{display:block}.top .primary{margin-top:14px;width:100%}.form-grid,.two{grid-template-columns:1fr}.span-2{grid-column:span 1}}
</style></head><body>
<section class="login" id="loginView"><form class="login-card" id="loginForm"><h1>Olitec</h1><p>Accesso alla gestione condivisa.</p><div id="loginError" class="notice hidden"></div><label>Username<input id="username" required autocomplete="username"></label><label>Password<input id="password" type="password" required autocomplete="current-password"></label><button class="primary" type="submit">Accedi</button><p class="footer">Primo accesso: admin / admin</p></form></section>
<section class="app hidden" id="appView"><aside><div class="brand"><small>Fondazione</small><strong>Olitec</strong></div><nav id="nav"></nav><button class="secondary logout" id="logout">Esci</button></aside><main><div id="status"></div><section id="membersView" class="view"></section><section id="structuresView" class="view hidden"></section><section id="gradesView" class="view hidden"></section><section id="groupsView" class="view hidden"></section><section id="notificationsView" class="view hidden"></section></main></section>
<script>
const SUPABASE_URL='https://xiqihzndgvhmaygsrcdh.supabase.co';
const SUPABASE_KEY='sb_publishable_AeGBs64qTcLzvZppepy8qg_7YOdivrE';
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=s=>document.querySelector(s); let structures=[],grades=[],members=[],groups=[],view='members';
const escape=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function flash(message,error=false){$('#status').innerHTML=`<div class="notice ${error?'':'ok'}">${escape(message)}</div>`;setTimeout(()=>$('#status').innerHTML='',4500)}
async function load(){const [s,g,m,gr]=await Promise.all([db.from('structures').select('*').order('name'),db.from('grades').select('*').order('name'),db.from('members').select('*,grades(name),member_structures(structures(id,name))').order('last_name'),db.from('member_groups').select('*,group_members(member_id)').order('name')]);for(const r of[s,g,m,gr])if(r.error)throw r.error;structures=s.data;grades=g.data;members=m.data;groups=gr.data;render()}
const navItems=[['members','Anagrafiche'],['structures','Strutture'],['grades','Gradi'],['groups','Crea gruppi'],['notifications','Invia notifica']];
function render(){ $('#nav').innerHTML=navItems.map(([id,label])=>`<button data-view="${id}" class="${view===id?'active':''}">${label}</button>`).join('');$('#nav').querySelectorAll('button').forEach(b=>b.onclick=()=>{view=b.dataset.view;render()});document.querySelectorAll('.view').forEach(x=>x.classList.add('hidden'));$('#'+view+'View').classList.remove('hidden');({members:renderMembers,structures:renderStructures,grades:renderGrades,groups:renderGroups,notifications:renderNotifications})[view]()}
const checkList=(id,items,checked=[])=>`<div class="check-list select-box" id="${id}">${items.map(x=>`<label class="check"><input type="checkbox" value="${x.id}" ${checked.includes(x.id)?'checked':''}>${escape(x.name)}</label>`).join('')||'<span class="empty">Nessun elemento.</span>'}</div>`;
const picked=id=>[...$('#'+id).querySelectorAll('input:checked')].map(x=>x.value);
function renderMembers(){const rows=members.map(m=>`<tr><td><b>${escape(m.first_name)} ${escape(m.last_name)}</b><br><small>${escape(m.email)}</small></td><td>${(m.member_structures||[]).map(x=>`<span class="chip">${escape(x.structures?.name)}</span>`).join('')}</td><td>${escape(m.grades?.name||'—')}</td><td><button class="secondary" onclick="editMember('${m.id}')">Modifica</button></td></tr>`).join('');$('#membersView').innerHTML=`<div class="top"><div><h1>Anagrafiche</h1><p class="subtitle">Dati condivisi in tempo reale.</p></div><button class="primary" id="newMember">+ Nuova anagrafica</button></div><section class="card"><div class="toolbar"><input id="memberSearch" placeholder="Cerca per nome o email"></div><div class="table-wrap"><table><thead><tr><th>Membro</th><th>Case</th><th>Grado</th><th></th></tr></thead><tbody id="memberRows">${rows||'<tr><td colspan="4" class="empty">Nessuna anagrafica.</td></tr>'}</tbody></table></div></section>`;$('#newMember').onclick=()=>memberForm();$('#memberSearch').oninput=e=>{const q=e.target.value.toLowerCase();$('#memberRows').querySelectorAll('tr').forEach((r,i)=>r.style.display=r.innerText.toLowerCase().includes(q)?'':'none')}}
window.editMember=id=>memberForm(members.find(m=>m.id===id));
function memberForm(m={}){const selected=(m.member_structures||[]).map(x=>x.structures?.id);$('#membersView').innerHTML=`<div class="top"><div><h1>${m.id?'Modifica':'Nuova'} anagrafica</h1><p class="subtitle">Le modifiche vengono salvate per tutti gli utenti.</p></div></div><form class="card" id="memberForm"><div class="form-grid"><label>Nome<input name="first_name" required value="${escape(m.first_name||'')}"></label><label>Cognome<input name="last_name" required value="${escape(m.last_name||'')}"></label><label>Email<input name="email" type="email" required value="${escape(m.email||'')}"></label><label>Telefono<input name="phone" value="${escape(m.phone||'')}"></label><label>Data di nascita<input name="birth_date" type="date" value="${escape(m.birth_date||'')}"></label><label>Data di arrivo<input name="arrival_date" type="date" value="${escape(m.arrival_date||'')}"></label><label>Grado<select name="grade_id"><option value="">—</option>${grades.map(g=>`<option value="${g.id}" ${m.grade_id===g.id?'selected':''}>${escape(g.name)}</option>`).join('')}</select></label><div></div><div class="span-2"><b>Case di riferimento</b>${checkList('memberStructures',structures,selected)}</div></div><div class="actions" style="margin-top:20px"><button class="primary">Salva</button><button type="button" class="secondary" id="cancelMember">Annulla</button>${m.id?'<button type="button" class="danger" id="deleteMember">Elimina</button>':''}</div></form>`;$('#cancelMember').onclick=renderMembers;$('#memberForm').onsubmit=async e=>{e.preventDefault();const data=Object.fromEntries(new FormData(e.target));const ids=picked('memberStructures');if(!ids.length)return flash('Seleziona almeno una casa.',true);const res=m.id?await db.from('members').update(data).eq('id',m.id):await db.from('members').insert(data).select().single();if(res.error)return flash(res.error.message,true);const id=m.id||res.data.id;const del=await db.from('member_structures').delete().eq('member_id',id);if(del.error)return flash(del.error.message,true);const ins=await db.from('member_structures').insert(ids.map(structure_id=>({member_id:id,structure_id})));if(ins.error)return flash(ins.error.message,true);flash('Anagrafica salvata.');await load()};if(m.id)$('#deleteMember').onclick=async()=>{if(confirm('Eliminare questa anagrafica?')){const r=await db.from('members').delete().eq('id',m.id);if(r.error)flash(r.error.message,true);else{flash('Anagrafica eliminata.');await load()}}}}
function manage(type,title,items){const key=type==='structures'?'structures':'grades';$('#'+type+'View').innerHTML=`<div class="top"><div><h1>${title}</h1><p class="subtitle">Configurazione condivisa.</p></div></div><section class="card"><form class="toolbar" id="add${type}"><input required placeholder="Nuovo ${type==='structures'?'nome struttura':'grado'}"><button class="primary">Aggiungi</button></form><div class="list">${items.map(x=>`<div class="item"><span>${escape(x.name)}</span><button class="danger" onclick="removeItem('${key}','${x.id}')">Rimuovi</button></div>`).join('')||'<p class="empty">Nessun elemento.</p>'}</div></section>`;$('#add'+type).onsubmit=async e=>{e.preventDefault();const name=e.target.querySelector('input').value.trim();const r=await db.from(key).insert({name});if(r.error)flash(r.error.message,true);else{flash('Salvato.');await load()}}}
function renderStructures(){manage('structures','Strutture',structures)}function renderGrades(){manage('grades','Gradi',grades)}window.removeItem=async(table,id)=>{if(confirm('Rimuovere questo elemento?')){const r=await db.from(table).delete().eq('id',id);if(r.error)flash(r.error.message,true);else await load()}}
function memberChoices(id,checked=[]){return `<div class="check-list select-box" id="${id}"><label class="check"><input type="checkbox" value="__all__">Seleziona tutti</label>${members.map(m=>`<label class="check"><input type="checkbox" value="${m.id}" ${checked.includes(m.id)?'checked':''}>${escape(m.first_name)} ${escape(m.last_name)}</label>`).join('')}</div>`}
function renderGroups(){ $('#groupsView').innerHTML=`<div class="top"><div><h1>Crea gruppo</h1><p class="subtitle">Gruppi disponibili a tutti gli amministratori.</p></div></div><section class="card"><form id="groupForm"><label>Nome gruppo<input id="groupName" required></label><b>Persone</b>${memberChoices('groupPeople')}<div class="actions" style="margin-top:18px"><button class="primary">Salva gruppo</button></div></form></section><section class="card"><h2>Gruppi salvati</h2><div class="list">${groups.map(g=>`<div class="item"><span>${escape(g.name)} <small>(${g.group_members.length} membri)</small></span><button class="danger" onclick="removeGroup('${g.id}')">Rimuovi</button></div>`).join('')||'<p class="empty">Nessun gruppo.</p>'}</div></section>`;const p=$('#groupPeople');p.onchange=e=>{if(e.target.value==='__all__')p.querySelectorAll('input:not([value="__all__"])').forEach(x=>x.checked=e.target.checked)};$('#groupForm').onsubmit=async e=>{e.preventDefault();const name=$('#groupName').value.trim(),ids=picked('groupPeople').filter(x=>x!=='__all__');if(!ids.length)return flash('Seleziona almeno una persona.',true);const r=await db.from('member_groups').insert({name}).select().single();if(r.error)return flash(r.error.message,true);const j=await db.from('group_members').insert(ids.map(member_id=>({group_id:r.data.id,member_id})));if(j.error)return flash(j.error.message,true);flash('Gruppo salvato.');await load()}}
window.removeGroup=async id=>{if(confirm('Rimuovere il gruppo?')){const r=await db.from('member_groups').delete().eq('id',id);if(r.error)flash(r.error.message,true);else await load()}}
function renderNotifications(){ $('#notificationsView').innerHTML=`<div class="top"><div><h1>Invia notifica</h1><p class="subtitle">Invia un messaggio ai membri selezionati.</p></div></div><section class="card"><form id="notificationForm"><label>Messaggio<textarea id="message" rows="5" required></textarea></label><b>Destinatari</b>${memberChoices('notificationPeople')}<div class="actions" style="margin-top:18px"><button class="primary">Invia notifica</button></div></form></section>`;const p=$('#notificationPeople');p.onchange=e=>{if(e.target.value==='__all__')p.querySelectorAll('input:not([value="__all__"])').forEach(x=>x.checked=e.target.checked)};$('#notificationForm').onsubmit=async e=>{e.preventDefault();const ids=picked('notificationPeople').filter(x=>x!=='__all__'),body=$('#message').value.trim();if(!ids.length)return flash('Seleziona almeno un destinatario.',true);const u=(await db.auth.getUser()).data.user;const r=await db.from('notifications').insert({body,created_by:u.id}).select().single();if(r.error)return flash(r.error.message,true);const j=await db.from('notification_recipients').insert(ids.map(member_id=>({notification_id:r.data.id,member_id})));if(j.error)return flash(j.error.message,true);flash('Notifica inviata.');e.target.reset()}}
$('#loginForm').onsubmit=async e=>{e.preventDefault();const username=$('#username').value.trim(),email=username.includes('@')?username:`${username}@olitec.local`;const {error}=await db.auth.signInWithPassword({email,password:$('#password').value});if(error){$('#loginError').textContent='Accesso non riuscito: '+error.message;$('#loginError').classList.remove('hidden');return}start()};$('#logout').onclick=async()=>{await db.auth.signOut();$('#appView').classList.add('hidden');$('#loginView').classList.remove('hidden')};
async function start(){try{await load();$('#loginView').classList.add('hidden');$('#appView').classList.remove('hidden');db.channel('olitec-live').on('postgres_changes',{event:'*',schema:'public'},()=>load().catch(()=>{})).subscribe()}catch(e){$('#loginError').textContent='Database non pronto: '+e.message;$('#loginError').classList.remove('hidden')}}
db.auth.getSession().then(({data:{session}})=>{if(session)start()});
</script>
</body></html>
