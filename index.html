<style>

ex-wrap:wrap;margin-bottom:16px}.toolbar input{flex:1;min-width:180px}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:680px}th,td{text-align:left;padding:13px;border-bottom:1px solid #edf0ed}th{font-size:.72rem;text-transform:uppercase;color:var(--muted);letter-spacing:.05em}.chips{display:flex;gap:5px;flex-wrap:wrap}.chip{background:var(--soft);color:#18563d;border-radius:20px;padding:3px 8px;font-size:.75rem}.empty{color:var(--muted);padding:20px 0}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.span-2{grid-column:span 2}.check-list{border:1px solid #cbd8cf;border-radius:8px;padding:10px;display:flex;gap:12px;flex-wrap:wrap;min-height:44px}.check{display:flex;align-items:center;gap:6px;font-weight:500;font-size:.9rem}.check input{width:auto}.actions{display:flex;gap:8px;flex-wrap:wrap}.notice{padding:10px 12px;border-radius:8px;background:#fff6d9;color:#725500;margin:0 0 16px}.ok{background:var(--soft);color:#18563d}.two{display:grid;grid-template-columns:1fr 1fr;gap:20px}.list{display:grid;gap:8px}.item{border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;justify-content:space-between;gap:10px;align-items:center}.select-box{max-height:250px;overflow:auto}.footer{color:var(--muted);font-size:.8rem;margin-top:10px}
.person{display:flex;align-items:center;gap:10px}.avatar{width:36px;height:36px;border-radius:50%;object-fit:cover;background:var(--soft);display:grid;place-items:center;font-weight:800;color:var(--green);flex:none;border:0;padding:0}.photo-button{border:0;background:transparent;padding:0;border-radius:50%;display:flex}.name-button{border:0;background:transparent;padding:0;text-align:left;color:var(--ink);font-weight:800;font-size:1em}.name-button:hover{color:var(--green);text-decoration:underline}.grade-badge{display:inline-flex;align-items:center;gap:7px}.grade-thumb{width:26px;height:26px;border-radius:6px;object-fit:cover;background:var(--soft);display:grid;place-items:center;color:var(--green);font-size:.8rem}.field-row{display:flex;gap:10px;align-items:center;margin-bottom:12px}.field-row input[type=file]{border:0;padding:0}.menu-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}.menu-card{text-align:left;border:1px solid var(--line);border-radius:14px;background:#fff;padding:20px;box-shadow:0 10px 30px #173d2e14}.menu-card b{display:block;font-size:1.1rem;margin-bottom:6px}.menu-card span{color:var(--muted);font-size:.88rem}.quick-actions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.out-of-stock td{color:#a43c37;background:#fff0ef}.group-row{cursor:pointer;font-weight:700}.group-row:hover td{background:#f6f9f6}.variant-cell{padding-left:30px;font-weight:500}.expand-arrow{display:inline-block;width:14px;color:var(--muted)}
dialog{border:0;border-radius:14px;padding:0;width:min(560px,calc(100vw - 28px));box-shadow:0 25px 80px rgba(0,0,0,.3)}dialog::backdrop{background:rgba(12,28,20,.48)}.modal{padding:24px}.modal-head{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:18px}.close{border:0;background:transparent;font-size:1.4rem;color:var(--muted)}.detail-head{display:flex;gap:14px;align-items:center;margin-bottom:20px}.detail-photo{width:80px;height:80px;border-radius:50%;object-fit:cover;background:var(--soft);display:grid;place-items:center;color:var(--green);font-weight:800;font-size:1.6rem}.detail-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 20px}.detail-list div{border-top:1px solid var(--line);padding-top:8px}.detail-list span{display:block;color:var(--muted);font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin-bottom:3px}

<script>
const SUPABASE_URL='https://xiqihzndgvhmaygsrcdh.supabase.co';
const SUPABASE_KEY='sb_publishable_AeGBs64qTcLzvZppepy8qg_7YOdivrE';
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=s=>document.querySelector(s); let structures=[],grades=[],members=[],groups=[],notifications=[],inventoryItems=[],itemRequests=[],assignmentRules=[],view='menu',inventoryStructureId=null,currentProfileMemberId=null;
const escape=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const initials=m=>((m.first_name||'?')[0]+(m.last_name||'?')[0]).toUpperCase();
const italianDate=d=>d?new Date(d+'T00:00:00').toLocaleDateString('it-IT'):'—';
function duration(date){if(!date) return '—';const start=new Date(date+'T00:00:00'),now=new Date();let years=now.getFullYear()-start.getFullYear(),months=now.getMonth()-start.getMonth(),days=now.getDate()-start.getDate();if(days<0){months--;days+=new Date(now.getFullYear(),now.getMonth(),0).getDate();}if(months<0){years--;months+=12;}return `${years}a ${months}m ${days}g`;}
function flash(message,error=false){$('#status').innerHTML=`<div class="notice ${error?'':'ok'}">${escape(message)}</div>`;setTimeout(()=>$('#status').innerHTML='',4500)}

async function load(){
  const [s,g,m,gr,nt,inv,req,rules]=await Promise.all([
    db.from('structures').select('*').order('name'),
    db.from('grades').select('*').order('name'),
    db.from('members').select('*,grades(name,image_url),member_structures(structures(id,name))').order('last_name'),
    db.from('member_groups').select('*,group_members(member_id)').order('name'),
    db.from('notifications').select('*,notification_recipients(member_id)').order('created_at',{ascending:false}),
    db.from('inventory_items').select('*').order('name'),
    db.from('item_requests').select('*,members(first_name,last_name)').order('created_at',{ascending:false}),
    db.from('assignment_rules').select('*').order('item_name')
  ]);
  for(const r of[s,g,m,gr,nt,inv,req,rules]) if(r.error) throw r.error;
  structures=s.data; grades=g.data; members=m.data; groups=gr.data; notifications=nt.data; inventoryItems=inv.data; itemRequests=req.data; assignmentRules=rules.data;
  render();
}

const navTree={
  menu:[['members','Anagrafiche'],['inventory','Inventario']],
  members:[['menu','Menu'],['structures','Strutture'],['grades','Gradi'],['notifications','Invia notifica'],['inbox','Ricevi notifiche']],
  structures:[['members','Anagrafiche']],
  grades:[['members','Anagrafiche']],
  notifications:[['members','Anagrafiche'],['groups','Crea gruppi']],
  groups:[['notifications','Invia notifica']],
  inbox:[['members','Anagrafiche']],
  inventory:[['menu','Menu'],['inventoryFood','Beni alimentari'],['inventoryEquipment','Attrezzature'],['inventoryClothing','Vestiario'],['inventoryConsumables','Materiale di consumo'],['requests','Richieste']],
  inventoryFood:[['inventory','Inventario']],
  inventoryEquipment:[['inventory','Inventario']],
  inventoryClothing:[['inventory','Inventario']],
  inventoryConsumables:[['inventory','Inventario']],
  requests:[['inventory','Inventario'],['rules','Regole di assegnazione']],
  rules:[['requests','Richieste']],
  profilo:[['menu','Menu'],['profiloAnagrafica','Anagrafica'],['profiloRichieste','Richieste']],
  profiloAnagrafica:[['profilo','Profilo']],
  profiloRichieste:[['profilo','Profilo']]
};
function render(){
  const entries=navTree[view]||[];
  $('#nav').innerHTML=entries.map(([id,label])=>`<button data-view="${id}">${label}</button>`).join('');
  $('#nav').querySelectorAll('button').forEach(b=>b.onclick=()=>{view=b.dataset.view;render()});
  document.querySelectorAll('.view').forEach(x=>x.classList.add('hidden'));
  $('#'+view+'View').classList.remove('hidden');
  ({menu:renderMenu,members:renderMembers,structures:renderStructures,grades:renderGrades,groups:renderGroups,notifications:renderNotifications,inbox:renderInbox,inventory:renderInventory,inventoryFood:renderInventoryFood,inventoryEquipment:renderInventoryEquipment,inventoryClothing:renderInventoryClothing,inventoryConsumables:renderInventoryConsumables,requests:renderRequests,rules:renderRules,profilo:renderProfilo,profiloAnagrafica:renderProfiloAnagrafica,profiloRichieste:renderProfiloRichieste})[view]();
}

function renderMenu(){
  const m=members.find(x=>x.id===currentProfileMemberId);
  const avatar=m?.photo_url?`<img class="avatar" src="${m.photo_url}" alt="">`:`<span class="avatar">${m?initials(m):'?'}</span>`;
  $('#menuView').innerHTML=`<div class="top"><div><h1>Menu</h1><p class="subtitle">Gestione della Fondazione Olivetti Tecnologia e Ricerca</p></div><button class="secondary" id="profileBtn" style="display:flex;align-items:center;gap:9px">${avatar}<span>Profilo</span></button></div><div class="menu-grid"><button class="menu-card" data-view="members"><b>Anagrafiche</b><span>Consulta e gestisci le schede di tutti i membri, le strutture e i gradi.</span></button><button class="menu-card" data-view="inventory"><b>Inventario</b><span>Consulta e gestisci gli articoli e i relativi costi unitari.</span></button></div>`;
  $('#profileBtn').onclick=()=>{view='profilo';render()};
  $('#menuView').querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;render()});
}

function structureSelectorHTML(){
  const options=structures.map(s=>`<option value="${s.id}" ${s.id===inventoryStructureId?'selected':''}>${escape(s.name)}</option>`).join('');
  return `<section class="card" style="padding:16px 20px"><label style="margin:0">Struttura<select class="inventory-structure-select">${options}</select></label></section>`;
}
function bindStructureSelector(viewId,rerender){
  document.querySelector('#'+viewId+' .inventory-structure-select').onchange=e=>{ inventoryStructureId=e.target.value; rerender(); };
}
function renderInventory(){
  if(!inventoryStructureId && structures.length) inventoryStructureId=structures[0].id;
  $('#inventoryView').innerHTML=`<div class="top"><div><h1>Inventario</h1><p class="subtitle">Scegli quale inventario consultare.</p></div></div>${structureSelectorHTML()}<div class="menu-grid"><button class="menu-card" data-view="inventoryFood"><b>Beni alimentari</b><span>Scorte alimentari.</span></button><button class="menu-card" data-view="inventoryEquipment"><b>Attrezzature</b><span>Strumenti, dotazioni e materiali durevoli.</span></button><button class="menu-card" data-view="inventoryClothing"><b>Vestiario</b><span>Uniformi, borse e capi di abbigliamento.</span></button><button class="menu-card" data-view="inventoryConsumables"><b>Materiale di consumo</b><span>Prodotti per la pulizia e materiale di consumo.</span></button><button class="menu-card" data-view="requests"><b>Richieste</b><span>Storico delle richieste di beni e approvazioni.</span></button></div>`;
  bindStructureSelector('inventoryView',renderInventory);
  $('#inventoryView').querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;render()});
}
const sizeOrder=['XXXXL','XXXL','XXL','XL','L','M','S','XS','XXS'];
function sizeRank(variant){
  if(!variant) return 999;
  const clean=variant.trim().toUpperCase().replace(/[^A-Z]/g,'');
  const idx=sizeOrder.indexOf(clean);
  return idx===-1?998:idx;
}
function inventoryListHTML(category){
  const items=inventoryItems.filter(it=>it.category===category && it.structure_id===inventoryStructureId);
  const groups=new Map();
  items.forEach(it=>{ if(!groups.has(it.name)) groups.set(it.name,[]); groups.get(it.name).push(it); });
  groups.forEach(list=>list.sort((a,b)=>sizeRank(a.variant)-sizeRank(b.variant)));
  const itemRow=(it,category,label)=>`<tr class="${Number(it.quantity)<=0?'out-of-stock':''}"><td>${label}</td><td>${it.quantity}</td><td>${it.unit_cost!=null?'€ '+Number(it.unit_cost).toFixed(2):'—'}</td><td>${escape(it.notes||'—')}</td><td><button class="secondary" onclick="editInventoryItem('${it.id}','${category}')">Modifica</button></td></tr>`;
  let rows='',gi=0;
  groups.forEach((list,name)=>{
    if(list.length===1){
      const it=list[0], label=escape(name)+(it.variant?` — ${escape(it.variant)}`:'');
      rows+=itemRow(it,category,label);
      return;
    }
    gi++; const gid='grp'+gi;
    const total=list.reduce((s,it)=>s+Number(it.quantity),0);
    rows+=`<tr class="group-row ${total<=0?'out-of-stock':''}" onclick="toggleInventoryGroup('${gid}')"><td><span class="expand-arrow" id="arrow_${gid}">▸</span>${escape(name)} <small style="font-weight:400;color:var(--muted)">(${list.length} taglie)</small></td><td>${total}</td><td>—</td><td>—</td><td></td></tr>`;
    list.forEach(it=>{ rows+=itemRow(it,category,`<span class="variant-cell">${escape(it.variant||'—')}</span>`).replace('<tr class="','<tr class="hidden '+gid+' '); });
  });
  return `<div class="table-wrap"><table><thead><tr><th>Articolo</th><th>Quantità</th><th>Costo unitario</th><th>Note</th><th></th></tr></thead><tbody>${rows||'<tr><td colspan="5" class="empty">Nessun articolo.</td></tr>'}</tbody></table></div>`;
}
window.toggleInventoryGroup=gid=>{
  const arrow=$('#arrow_'+gid), open=arrow.textContent==='▾';
  arrow.textContent=open?'▸':'▾';
  document.querySelectorAll('.'+gid).forEach(row=>row.classList.toggle('hidden',open));
};
const inventoryCategoryMeta={
  alimentari:{viewId:'inventoryFoodView',title:'Beni alimentari',subtitle:'Scorte alimentari e costi unitari.'},
  attrezzature:{viewId:'inventoryEquipmentView',title:'Attrezzature',subtitle:'Dotazioni e costi unitari.'},
  vestiario:{viewId:'inventoryClothingView',title:'Vestiario',subtitle:'Uniformi, borse e capi di abbigliamento.'},
  consumo:{viewId:'inventoryConsumablesView',title:'Materiale di consumo',subtitle:'Prodotti per la pulizia e materiale di consumo.'}
};
function renderInventoryCategory(category){
  const meta=inventoryCategoryMeta[category];
  if(!inventoryStructureId && structures.length) inventoryStructureId=structures[0].id;
  $('#'+meta.viewId).innerHTML=`<div class="top"><div><h1>${meta.title}</h1><p class="subtitle">${meta.subtitle}</p></div><button class="primary" id="newItem">+ Nuovo articolo</button></div>${structureSelectorHTML()}<section class="card">${inventoryListHTML(category)}</section>`;
  bindStructureSelector(meta.viewId,()=>renderInventoryCategory(category));
  $('#newItem').onclick=()=>inventoryForm({},category);
}
function renderInventoryFood(){renderInventoryCategory('alimentari')}
function renderInventoryEquipment(){renderInventoryCategory('attrezzature')}
function renderInventoryClothing(){renderInventoryCategory('vestiario')}
function renderInventoryConsumables(){renderInventoryCategory('consumo')}

const requestStatusLabel={pending:'In attesa',approved:'Approvata',rejected:'Rifiutata',auto_rejected:'Rifiutata automaticamente'};
function evaluateRequest(memberId,itemName,quantity){
  const rule=assignmentRules.find(r=>r.item_name.trim().toLowerCase()===itemName.trim().toLowerCase());
  if(!rule) return {ok:true};
  if(quantity>rule.max_quantity) return {ok:false,reason:`quantità massima consentita: ${rule.max_quantity}`};
  if(rule.min_period_days>0){
    const cutoff=Date.now()-rule.min_period_days*86400000;
    const recent=itemRequests.find(r=>r.member_id===memberId && r.item_name.trim().toLowerCase()===itemName.trim().toLowerCase() && r.status!=='rejected' && r.status!=='auto_rejected' && new Date(r.created_at).getTime()>cutoff);
    if(recent) return {ok:false,reason:`periodo minimo tra le richieste non rispettato (${rule.min_period_days} giorni)`};
  }
  return {ok:true};
}
function renderRequests(){
  const rows=itemRequests.map(r=>`<tr><td>${r.members?escape(r.members.first_name+' '+r.members.last_name):'—'}</td><td>${escape(r.item_name)}</td><td>${r.quantity}</td><td>${new Date(r.created_at).toLocaleString('it-IT')}</td><td>${requestStatusLabel[r.status]||r.status}</td><td>${r.status==='pending'?`<button class="secondary" onclick="decideRequest('${r.id}','approved')">Approva</button> <button class="danger" onclick="decideRequest('${r.id}','rejected')">Rifiuta</button>`:escape(r.reject_reason||'')}</td></tr>`).join('');
  $('#requestsView').innerHTML=`<div class="top"><div><h1>Richieste</h1><p class="subtitle">Storico delle richieste di beni e approvazioni.</p></div></div><section class="card"><div class="table-wrap"><table><thead><tr><th>Membro</th><th>Articolo</th><th>Quantità</th><th>Data</th><th>Stato</th><th></th></tr></thead><tbody>${rows||'<tr><td colspan="6" class="empty">Nessuna richiesta.</td></tr>'}</tbody></table></div></section>`;
}
async function submitItemRequest(memberId,itemId,quantity){
  if(!itemId) return flash('Seleziona un articolo disponibile.',true);
  if(!memberId) return flash('Nessuna anagrafica collegata a questo account.',true);
  const item=inventoryItems.find(it=>it.id===itemId);
  const label=item.name+(item.variant?' — '+item.variant:'');
  const check=evaluateRequest(memberId,item.name,quantity);
  let status=check.ok?'pending':'auto_rejected', reason=check.ok?null:check.reason;
  if(status==='pending' && quantity>Number(item.quantity)){ status='auto_rejected'; reason=`quantità non disponibile in magazzino (disponibili: ${item.quantity})`; }
  const r=await db.from('item_requests').insert({member_id:memberId,item_name:label,inventory_item_id:itemId,quantity,status,reject_reason:reason});
  if(r.error) return flash(r.error.message,true);
  flash(status==='pending'?'Richiesta inviata, in attesa di approvazione.':'Richiesta rifiutata automaticamente: '+reason,status!=='pending');
  await load();
}
function renderProfilo(){

  const avatar=m?.photo_url?`<img class="detail-photo" src="${m.photo_url}" alt="">`:`<span class="detail-photo">${m?initials(m):'?'}</span>`;

window.decideRequest=async(id,status)=>{
  const request=itemRequests.find(r=>r.id===id);
  const u=(await db.auth.getUser()).data.user;
  const r=await db.from('item_requests').update({status,decided_at:new Date().toISOString(),decided_by:u.id}).eq('id',id).eq('status','pending').select();
  if(r.error) return flash(r.error.message,true);
  if(!r.data.length){ flash('Questa richiesta è già stata gestita.',true); await load(); return; }
  if(status==='approved' && request?.inventory_item_id){
    const item=inventoryItems.find(it=>it.id===request.inventory_item_id);
    if(item){
      const newQty=Math.max(0,Number(item.quantity)-Number(request.quantity));
      const upd=await db.from('inventory_items').update({quantity:newQty}).eq('id',item.id);
      if(upd.error){ flash(upd.error.message,true); await load(); return; }
    }
  }
  flash(status==='approved'?'Richiesta approvata e magazzino aggiornato.':'Richiesta rifiutata.');
  await load();
};

    const idCardFile=form.idCardFile.files[0]; delete data.idCardFile;

      const up=await db.storage.from('member-photos').upload(path,photoFile,{upsert:true});

      if(r.error) return flash(r.error.message,true);
    }
    const del=await db.from('member_structures').delete().eq('member_id',id);
    if(del.error) return flash(del.error.message,true);
    const ins=await db.from('member_structures').insert(ids.map(structure_id=>({member_id:id,structure_id})));

window.removeGroup=async id=>{if(confirm('Rimuovere il gruppo?')){const r=await db.from('member_groups').delete().eq('id',id);if(r.error) flash(r.error.message,true); else await load();}};

function renderNotifications(){
  $('#notificationsView').innerHTML=`<div class="top"><div><h1>Invia notifica</h1><p class="subtitle">Invia un messaggio o un PDF ai membri selezionati.</p></div></div><section class="card"><form id="notificationForm"><b>Casa di riferimento</b><small style="display:block;color:var(--muted);margin:4px 0 8px">Lascia vuoto per vedere tutti i membri.</small>${checkList('notificationHouses',structures)}<div style="margin-top:14px"><b>Gruppi salvati</b><small style="display:block;color:var(--muted);margin:4px 0 8px">Selezionare un gruppo aggiunge tutti i suoi membri.</small>${checkList('notificationGroups',groups)}</div><div style="margin-top:14px"><b>Destinatari</b>${memberChoices('notificationPeople',members)}</div><label>Messaggio<textarea id="message" rows="5" placeholder="Scrivi il messaggio da inviare"></textarea></label><label>PDF allegato<input id="notificationPdf" type="file" accept="application/pdf"><small>Facoltativo. Sarà visibile nella ricezione dei destinatari.</small></label><div class="actions" style="margin-top:18px"><button class="primary">Invia notifica</button></div></form></section>`;
  bindAllToggle('notificationPeople');
  $('#notificationHouses').onchange=()=>{
    const houses=picked('notificationHouses'), previous=picked('notificationPeople').filter(x=>x!=='__all__'), people=membersForHouses(houses);
    $('#notificationPeople').outerHTML=memberChoices('notificationPeople',people,previous.filter(id=>people.some(m=>m.id===id)));
    bindAllToggle('notificationPeople');
  };
  $('#notificationGroups').onchange=()=>{
    const groupIds=picked('notificationGroups'), extra=groups.filter(g=>groupIds.includes(g.id)).flatMap(g=>g.group_members.map(x=>x.member_id));
    extra.forEach(id=>{const box=$('#notificationPeople').querySelector(`input[value="${id}"]`); if(box) box.checked=true;});
  };
  $('#notificationForm').onsubmit=async e=>{
    e.preventDefault();
    const ids=picked('notificationPeople').filter(x=>x!=='__all__'), body=$('#message').value.trim(), file=$('#notificationPdf').files[0];
    if(!ids.length) return flash('Seleziona almeno un destinatario.',true);
    if(!body && !file) return flash('Inserisci un testo o allega un PDF.',true);
    const u=(await db.auth.getUser()).data.user;
    const r=await db.from('notifications').insert({body,created_by:u.id}).select().single();
    if(r.error) return flash(r.error.message,true);
    if(file){
      const path=`${r.data.id}/${file.name}`;
      const up=await db.storage.from('notification-pdfs').upload(path,file,{upsert:true});
      if(up.error) return flash(up.error.message,true);
      await db.from('notifications').update({pdf_url:path,pdf_name:file.name}).eq('id',r.data.id);
    }
    const j=await db.from('notification_recipients').insert(ids.map(member_id=>({notification_id:r.data.id,member_id})));
    if(j.error) return flash(j.error.message,true);
    flash('Notifica inviata.'); await load();
  };
}

function showDocument(signedUrl,title,path){
  $('#documentTitle').textContent=title||'Documento';
  const isImage=/\.(jpe?g|png|gif|webp|bmp|heic)$/i.test(path||'');
  $('#documentImage').style.display=isImage?'':'none';
  $('#documentFrame').style.display=isImage?'none':'';
  $('#documentImage').src=isImage?signedUrl:'';
  $('#documentFrame').src=isImage?'about:blank':signedUrl;
  $('#documentDialog').showModal();
}
window.openMemberDocument=async(path,title)=>{
  const r=await db.storage.from('member-documents').createSignedUrl(path,3600);
  if(r.error) return flash(r.error.message,true);
  showDocument(r.data.signedUrl,title,path);
};
window.openNotificationPdf=async(path,title)=>{
  const r=await db.storage.from('notification-pdfs').createSignedUrl(path,3600);
  if(r.error) return flash(r.error.message,true);
  showDocument(r.data.signedUrl,title,path);
};
$('#closeDocument').onclick=()=>{$('#documentDialog').close();$('#documentFrame').src='about:blank';$('#documentImage').src='';};

function renderInbox(){
  const currentId=$('#inboxMember')?.value||members[0]?.id||'';
  $('#inboxView').innerHTML=`<div class="top"><div><h1>Notifiche ricevute</h1><p class="subtitle">Anteprima della ricezione per ogni account.</p></div></div><section class="card"><label>Visualizza le notifiche di<select id="inboxMember">${members.map(m=>`<option value="${m.id}" ${m.id===currentId?'selected':''}>${escape(m.first_name)} ${escape(m.last_name)}</option>`).join('')}</select></label><div class="list" id="inboxList" style="margin-top:16px"></div></section>`;
  $('#inboxMember').onchange=renderInboxList;
  renderInboxList();
}
function renderInboxList(){
  const memberId=$('#inboxMember').value;
  const messages=notifications.filter(n=>(n.notification_recipients||[]).some(x=>x.member_id===memberId));
  $('#inboxList').innerHTML=messages.map(n=>`<div class="item"><span><b>${new Date(n.created_at).toLocaleString('it-IT')}</b><br><small>${escape(n.body||'PDF allegato senza testo')}</small></span>${n.pdf_url?`<button class="secondary" onclick="openNotificationPdf('${n.pdf_url}','${escape(n.pdf_name).replace(/'/g,"\\'")}')">Apri PDF: ${escape(n.pdf_name)}</button>`:''}</div>`).join('')||'<p class="empty">Nessuna notifica ricevuta.</p>';
}

$('#loginForm').onsubmit=async e=>{e.preventDefault();const username=$('#username').value.trim(),email=username.includes('@')?username:`${username}@olitec.local`;const {error}=await db.auth.signInWithPassword({email,password:$('#password').value});if(error){$('#loginError').textContent='Accesso non riuscito: '+error.message;$('#loginError').classList.remove('hidden');return}start()};
$('#logout').onclick=async()=>{await db.auth.signOut();$('#appView').classList.add('hidden');$('#loginView').classList.remove('hidden')};
async function start(){try{view='menu';const {data:{user}}=await db.auth.getUser();const prof=await db.from('profiles').select('member_id').eq('id',user.id).single();currentProfileMemberId=prof.data?.member_id||null;await load();$('#loginView').classList.add('hidden');$('#appView').classList.remove('hidden');db.channel('olitec-live').on('postgres_changes',{event:'*',schema:'public'},()=>load().catch(()=>{})).subscribe()}catch(e){$('#loginError').textContent='Database non pronto: '+e.message;$('#loginError').classList.remove('hidden')}}
</script>
</body></html>
